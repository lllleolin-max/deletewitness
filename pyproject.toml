[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deletewitness"
version = "0.1.0"
description = "SQLite profile tombstones, shared attachment deletion intents and concrete recovery receipts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "lllleolin-max"}]
dependencies = []

[project.scripts]
deletewitness = "deletewitness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
